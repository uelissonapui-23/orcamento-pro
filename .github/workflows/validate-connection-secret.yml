name: Diagnóstico manual de sintaxe da conexão (sem banco)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax-only:
    # Somente após revisão/merge e autorização expressa; nunca código de PR.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'uelissonapui-23/orcamento-pro'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validar somente sintaxe — sem conexão, SQL ou artefatos
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python3 -I -B -c "import sys; sys.path.insert(0, 'scripts'); from validate_connection_secret import main; raise SystemExit(main())"
