name: Atualizar Supabase em produção

on:
  push:
    branches: ["main"]
    paths:
      - "supabase/migrations/**"
      - "scripts/apply_migrations.py"
      - ".github/workflows/deploy-supabase.yml"
  workflow_dispatch:

concurrency:
  group: orcamento-pro-migrations
  cancel-in-progress: false

jobs:
  migrate:
    name: Aplicar migrations isoladas do Orçamento Pro
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Instalar cliente PostgreSQL
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Validar SQL sem conexão
        run: python3 scripts/apply_migrations.py --plan
      - name: Aplicar lote atômico no projeto aprovado
        env:
          SUPABASE_PROJECT_ID: aiblckekbiudkyrkywnz
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python3 scripts/apply_migrations.py
