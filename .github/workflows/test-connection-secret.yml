name: Verificar diagnóstico com URIs sintéticas
on:
  pull_request:
    paths:
      - scripts/validate_connection_secret.py
      - scripts/apply_migrations.py
      - tests/test_connection_secret.py
      - .github/workflows/validate-connection-secret.yml
      - .github/workflows/test-connection-secret.yml
permissions:
  contents: read
jobs:
  synthetic-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p 'test_connection_secret.py' -v
