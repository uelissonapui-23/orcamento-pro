name: Verificar integridade OP-01 em PostgreSQL descartável
on:
  pull_request:
    paths:
      - tests/test_quote_approval_db.py
      - tests/test_migration_runner.py
      - supabase/migrations/**
      - .github/workflows/test-quote-approval.yml
      - .github/workflows/deploy-supabase.yml
permissions:
  contents: read
jobs:
  postgres-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: synthetic-op08-only
          POSTGRES_DB: op08_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d op08_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Instalar somente cliente de QA
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Validar inventário e testar PostgreSQL real
        env:
          OP01_TEST_DB_URL: postgresql://postgres:synthetic-op08-only@127.0.0.1:5432/op08_test
        run: |
          python3 scripts/apply_migrations.py --plan
          python3 -m unittest discover -s tests -p 'test_quote_approval_db.py' -v
